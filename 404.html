<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haxnation — Events</title>
    <script>
        // GitHub Pages SPA fallback: redirect pretty URLs to hash routes.
        // e.g. /certificate/verify/<id> -> /#/certificate/verify/<id>
        //      /certificate?eventId=<id> -> /#/certificate?eventId=<id>
        (function () {
            var path = window.location.pathname;
            var search = window.location.search || '';
            var hash = window.location.hash || '';
            // Don't loop if already on a hash route or at root.
            if (!hash && path && path !== '/') {
                window.location.replace('/#' + path + search);
            } else {
                window.location.replace('/');
            }
        })();
    </script>
</head>
<body>
    <p style="font-family: monospace">Redirecting…</p>
</body>
</html>
